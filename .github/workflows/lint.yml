name: Quality & Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shellcheck:
    name: ShellCheck Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          echo "🔍 Running ShellCheck on all .sh scripts..."
          find scripts -type f -name "*.sh" -print0 | xargs -0 -r shellcheck

  test:
    name: Automated Tests (BATS) & Index Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Index Catalog is Synchronized
        run: |
          echo "📑 Checking scripts/index.md synchronization..."
          bash scripts/update-index.sh --check

      - name: Install BATS
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run BATS Unit Tests
        run: |
          echo "🧪 Running BATS test suite..."
          bats tests/
